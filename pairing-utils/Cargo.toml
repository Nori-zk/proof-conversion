[package]
name = "proof-conversion-pairing-utils"
version = "0.4.0"
edition = "2021"

[lib]
name = "pairing_utils"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "convert_from_sp1_groth16"
path = "src/bin/convert_from_sp1_groth16.rs"
required-features = ["sp1-bin"]

[dependencies]
ark-ff = "0.4.2"
ark-ff-macros = "0.4.2"
ark-bn254 = "0.4.0"
ark-std = "0.4.0"
ark-ec = "0.4.2"
ark-poly = "0.4.0"
ark-serialize = "0.4.2"
ark-groth16 = "0.4.0"
ark-snark = "0.4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_tuple = "1.1"
num-bigint = "0.4"
num-traits = "0.2"
sp1-sdk = { version = "5.0.0", optional = true }
sp1-verifier = { version = "5.2.4", features = ["ark"], optional = true }
thiserror = "1.0"
getrandom = { version = "0.2", features = ["js"], optional = true }

# WebAssembly-specific output (for wasm-pack)
# [target.wasm32-unknown-unknown.dependencies]
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.4"

[features]
wasm = ["wasm-bindgen", "serde-wasm-bindgen"]
sp1-bin = ["sp1-sdk"]
sp1-wasm = ["sp1-verifier", "getrandom"]

# Conditional dependencies for Wasm
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.4", optional = true }